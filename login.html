<!--
  login.html
  Login form for the Reps&Habits workout tracker.
  Submits to the "/login" endpoint required by the assignment.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Reps&Habits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-box">
    <h2>Login</h2>
    <form action="/login" method="POST">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" size="30" required /><br>

      <label for="password">Password</label>
      <input type="password" name="password" id="password" size="30" required /><br>

      <input type="submit" value="Log In" />
    </form>
    <p><a href="register.html">Need an account? Register here</a></p>
  </div>
</body>
</html>
