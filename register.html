<!--
  register.html
  Registration form for the Reps&Habits workout tracker.
  Submits to the "/register" endpoint required by the assignment.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Reps&Habits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-box">
    <h2>Create Account</h2>
    <form action="/register" method="POST">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" size="30" required /><br>

      <label for="email">Email</label>
      <input type="email" name="email" id="email" size="30" required /><br>

      <label for="password">Password</label>
      <input type="password" name="password" id="password" size="30" required /><br>

      <input type="submit" value="Sign Up" />
    </form>
    <p><a href="login.html">Already have an account? Login here</a></p>
  </div>
</body>
</html>
